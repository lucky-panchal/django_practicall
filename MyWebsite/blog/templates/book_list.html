{% extends "base.html" %}

{% block title %}Book List{% endblock %}

{% block content %}
    <h1>All Books</h1>
    <ul>
        {% for book in books %}
            <li>{{ book.title }} — {{ book.author }} ({{ book.published_date }})</li>
        {% empty %}
            <li>No books found. Add some via <a href="/admin/">Admin</a>.</li>
        {% endfor %}
    </ul>
{% endblock %}

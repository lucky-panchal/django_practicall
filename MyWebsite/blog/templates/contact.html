{% extends "base.html" %}

{% block title %}Contact{% endblock %}

{% block content %}
    <h1>Contact Us</h1>
    <form method="post">
        {% csrf_token %}
        <label>Name: <input type="text" name="name" required></label><br><br>
        <label>Email: <input type="email" name="email" required></label><br><br>
        <button type="submit">Submit</button>
    </form>
{% endblock %}
